name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les outils
        run: pip install ruff

      - name: Lint Python
        run: ruff check . --select E9,F63,F7,F82

      - name: Compilation Python
        run: python -m compileall -q models/ __init__.py

      - name: Validation XML
        run: |
          python - << 'PYEOF'
          import sys, glob
          from xml.etree import ElementTree
          erreurs = 0
          for f in glob.glob('**/*.xml', recursive=True):
              try:
                  ElementTree.parse(f)
                  print(f"OK   {f}")
              except ElementTree.ParseError as e:
                  print(f"FAIL {f}: {e}")
                  erreurs += 1
          sys.exit(1 if erreurs else 0)
          PYEOF

  deploy:
    name: Déploiement VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Envoyer le module (rsync)
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/odoo19/mes-modules-pro/product_barcode_print_intc/

      - name: Redémarrer Odoo
        run: ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo systemctl restart odoo"
